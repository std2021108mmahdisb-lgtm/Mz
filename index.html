<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>توزيع الطحين</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#F2F0EA;--card:#fff;--ink:#14201F;--mut:#4A5957;--pri:#1F5A54;--soft:#D9E9E4;--acc:#B3602D;--plum:#4A3B7C;--note:#FFE08A;--noteink:#352600;--line:#CBC7BB;--red:#AE3A32}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 'Readex Pro',system-ui,'Segoe UI',Tahoma,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
header{flex:none;background:var(--pri);color:#fff;padding:14px 18px 16px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:20px;font-weight:700}
header p{margin:0;opacity:.9;font-size:13px}
main{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:640px;padding:12px 14px 2px;margin:0 auto 8px}main::-webkit-scrollbar{display:none}
section{display:none}section.on{display:block}
.box,.fam,.merged{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px}
.box{padding:14px}
label{display:block;font-size:13px;color:var(--mut);margin:9px 0 4px;font-weight:600}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#F7F6F1;border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--pri);background:#fff}
textarea{min-height:62px;resize:none}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 14px;background:var(--pri);color:#fff;cursor:pointer;font-size:15px}
.btn.big{width:100%;margin-top:14px;padding:13px;font-size:17px}
.btn.alt{background:var(--soft);color:var(--pri);border:1px solid #B5D0C9}
.btn.warn{background:var(--red)}.btn.acc{background:var(--acc)}
.btn:active{transform:scale(.97)}
.row{display:flex;gap:8px}.row>*{flex:1}
.search{position:relative}
.search input{padding-inline-start:42px;background:#fff;border-color:#B9B5A9}
.search svg{position:absolute;inset-inline-start:13px;top:12px;width:20px;stroke:var(--mut)}
.hint{text-align:center;color:var(--mut);padding:28px 10px}.hint b{display:block;font-size:34px}
.fam{position:relative;overflow:hidden}
.fam .in{padding:14px}
.pg{position:absolute;left:0;top:0;background:var(--plum);color:#fff;font-size:22px;font-weight:700;padding:6px 16px 8px;border-radius:0 0 16px 0;min-width:64px;text-align:center;line-height:1.2}
.pg small{display:block;font-size:10px;font-weight:500;opacity:.85}
.nm{font-size:19px;font-weight:700;margin:0 0 10px;padding-left:80px;min-height:44px}
.kv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.kv span{color:var(--mut);font-size:14px}.kv b{font-size:16px;text-align:left}
.kv b.mb{background:var(--soft);color:var(--pri);padding:1px 14px;border-radius:10px}
.note{background:var(--note);color:var(--noteink);font-weight:700;border-radius:10px;padding:8px 12px;margin:0 0 10px}
.chip{display:inline-block;background:var(--soft);color:var(--pri);border-radius:99px;padding:1px 10px;font-size:13px;margin:2px 0 2px 4px;font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.acts .btn{padding:9px 6px;font-size:14px}
.sum{background:var(--pri);color:#fff;border-radius:18px;padding:12px 16px;margin-bottom:12px}
.sum h3{margin:0 0 4px;font-size:14px}
.sum .kv{border-color:rgba(255,255,255,.35)}.sum .kv span{color:#fff}
.merged{overflow:hidden}.merged .fam{border:0;border-radius:0;margin:0}
.merged .fam+.fam{border-top:6px solid var(--bg)}
.stat{display:flex;align-items:center;gap:14px}
.stat i{font-style:normal;font-size:28px;background:var(--soft);width:54px;height:54px;border-radius:16px;display:grid;place-items:center}
.stat b{font-size:30px;display:block;line-height:1.1}.stat span{color:var(--mut)}
nav{flex:none;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:0;font:inherit;font-size:12px;font-weight:600;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 0;border-radius:12px}
nav button svg{width:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--pri);background:var(--soft)}
#dlg{position:fixed;inset:0;background:rgba(15,25,25,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
#dlg.on{display:flex}
#dlg>div{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
#dlg h2{margin:0 0 4px;font-size:18px}
.pick{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:#F7F6F1;border:1px solid var(--line);margin-top:8px}
.pick input{width:22px;height:22px;accent-color:var(--pri)}.pick span{flex:1}
#toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:20}
#toast.on{opacity:1}
.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 4px}
.num{font:inherit;font-size:19px;font-weight:700;height:46px;border-radius:14px;border:1.5px solid var(--line);background:#F7F6F1;color:var(--ink);cursor:pointer}
.num.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chg{display:flex;align-items:center;gap:8px;border-radius:10px;padding:7px 12px;margin:0 0 8px;font-weight:700;font-size:14px}
.chg.add{background:#D3EBD9;color:#12482A}.chg.del{background:#F6D9D5;color:#6E1D17}
.clr{border:0;background:0;font:inherit;font-size:12px;color:var(--mut);text-decoration:underline;padding:0 0 6px}
</style>
</head>
<body>
<header><h1 id="ttl">الصفحة الرئيسية</h1><p>توزيع حصة الطحين</p></header>
<main>
<section id="home" class="on"><div class="box">
<label>اسم رب الأسرة</label><input id="n" placeholder="مثال: مهدي صابر">
<label>عدد أفراد الأسرة</label><input id="m" type="number" inputmode="numeric" min="1" placeholder="4">
<label>رقم الصفحة</label><input id="p" inputmode="numeric" placeholder="125">
<label>الملاحظات</label><textarea id="t" placeholder="اختياري"></textarea>
<button class="btn big" id="add">إضافة عائلة</button></div></section>

<section id="fam">
<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="fq" placeholder="ابحث عن عائلة..."></div>
<div class="row" style="margin:10px 0"><button class="btn alt" id="bk">⬇ نسخ احتياطي</button><button class="btn alt" id="rs">⬆ استعادة البيانات</button></div>
<input type="file" id="rf" accept=".json,application/json" hidden>
<div id="fr"></div></section>

<section id="srch">
<div class="search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="sq" placeholder="ابحث بالاسم أو رقم الصفحة..."></div>
<div id="sr" style="margin-top:14px"></div></section>

<section id="stats">
<div class="box stat"><i>🏠</i><div><b id="s1">0</b><span>عدد الأسر الكلي</span></div></div>
<div class="box stat"><i>👨‍👩‍👧‍👦</i><div><b id="s2">0</b><span>عدد أفراد الأسر الكلي</span></div></div></section>
</main>

<nav id="nav">
<button data-t="home" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>الرئيسية</button>
<button data-t="fam"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 5a3.5 3.5 0 010 7M18 14c2 .6 3.5 2.4 3.5 6"/></svg>العوائل</button>
<button data-t="srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>البحث</button>
<button data-t="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>الإحصائيات</button>
</nav>
<div id="dlg"><div id="dc"></div></div><div id="toast"></div>

<script>
const $=s=>document.querySelector(s),KG=9,PRICE=250,BAG=50;
const TT={home:'الصفحة الرئيسية',fam:'العوائل',srch:'صفحة البحث',stats:'الإحصائيات'};
let DB=[];try{DB=JSON.parse(localStorage.getItem('fam')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('fam',JSON.stringify(DB))}catch(e){}};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').toLowerCase().trim();
const get=id=>DB.find(f=>f.id===id);
const fmtShare=b=>{const k=b*KG;return k>=BAG?`${Math.floor(k/BAG)} كيس`+(k%BAG?` و ${k%BAG} كيلو`:''):`${k} كيلو`};
const fmtMoney=b=>(b*PRICE).toLocaleString('en-US')+' د.ع';
const find=q=>{q=norm(q);return q?DB.filter(f=>norm(f.name).includes(q)||norm(f.page).includes(q)):[]};
function group(f){const s=new Set([f.id]),q=[f];while(q.length){const x=q.pop();DB.forEach(y=>{if(!s.has(y.id)&&(x.links.includes(y.id)||y.links.includes(x.id))){s.add(y.id);q.push(y)}})}
return DB.filter(x=>s.has(x.id)).sort((a,b)=>b.links.length-a.links.length)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)}
function modal(h){$('#dc').innerHTML=h;$('#dlg').classList.add('on')}
const closeM=()=>$('#dlg').classList.remove('on');
$('#dlg').onclick=e=>{if(e.target.id==='dlg')closeM()};

function card(f,full){
const ln=DB.filter(x=>f.links.includes(x.id)).map(x=>`<span class="chip">${esc(x.name)}</span>`).join('');
return `<div class="fam"><div class="pg"><small>صفحة</small>${esc(f.page)}</div><div class="in">
<div class="nm">${esc(f.name)}</div>
${!full&&(f.changes||[]).length?`${f.changes.map(c=>`<div class="chg ${c.t}">${c.t==='add'?'➕ تم إضافة':'➖ تم حذف'} ${c.n} ${c.n>2&&c.n<11?'أفراد':'فرد'}</div>`).join('')}<button class="clr" data-a="clr" data-id="${f.id}">مسح الإشعارات</button>`:''}
${f.notes?`<div class="note">${esc(f.notes)}</div>`:''}
<div class="kv"><span>عدد أفراد الأسرة</span><b class="mb">${f.members}</b></div>
<div class="kv"><span>حصة الطحين</span><b>${fmtShare(f.base)}</b></div>
<div class="kv"><span>المبلغ المستحق</span><b>${fmtMoney(f.base)}</b></div>
${full&&ln?`<div class="kv"><span>العوائل المرتبطة</span><div>${ln}</div></div>`:''}
${full?`<div class="acts"><button class="btn alt" data-a="edit" data-id="${f.id}">✏️ تعديل التفاصيل</button><button class="btn alt" data-a="vars" data-id="${f.id}">± المتغيرات</button><button class="btn acc" data-a="link" data-id="${f.id}">🔗 ربط العوائل</button><button class="btn warn" data-a="del" data-id="${f.id}">🗑 حذف العائلة</button></div>`:''}
</div></div>`}

function renderFam(){const r=find($('#fq').value);$('#fr').innerHTML=!$('#fq').value.trim()?'<div class="hint"><b>🔍</b>اكتب اسم العائلة لتظهر بطاقتها</div>':r.length?r.map(f=>card(f,1)).join(''):'<div class="hint">لا توجد نتائج</div>'}
function renderSrch(){const q=$('#sq').value,r=find(q);let h='';
if(!q.trim())h='<div class="hint"><b>🌾</b>اكتب اسم العائلة أو رقم الصفحة</div>';
else if(!r.length)h='<div class="hint">لا توجد نتائج</div>';
else{const seen=new Set();r.forEach(f=>{if(seen.has(f.id))return;const g=group(f);g.forEach(x=>seen.add(x.id));
if(g.length>1){const b=g.reduce((s,x)=>s+x.base,0),mm=g.reduce((s,x)=>s+x.members,0);
h+=`<div class="sum"><h3>الإجمالي للعوائل المرتبطة</h3><div class="kv"><span>عدد أفراد الأسر الكلي</span><b>${mm}</b></div><div class="kv"><span>حصة الطحين الكلية</span><b>${fmtShare(b)}</b></div><div class="kv"><span>مجموع المبلغ</span><b>${fmtMoney(b)}</b></div></div><div class="merged">${g.map(x=>card(x,0)).join('')}</div>`}
else h+=card(g[0],0)})}
$('#sr').innerHTML=h}
function renderStats(){$('#s1').textContent=DB.length;$('#s2').textContent=DB.reduce((s,f)=>s+f.members,0)}
const refresh=()=>{renderFam();renderSrch();renderStats()};

$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;
document.querySelectorAll('nav button,section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.t).classList.add('on');$('#ttl').textContent=TT[b.dataset.t];refresh()};
$('#fq').oninput=renderFam;$('#sq').oninput=renderSrch;

$('#add').onclick=()=>{const name=$('#n').value.trim(),m=parseInt($('#m').value),p=$('#p').value.trim();
if(!name||!(m>0)||!p)return toast('أكمل الاسم والعدد ورقم الصفحة');
DB.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name,members:m,base:m,page:p,notes:$('#t').value.trim(),links:[]});
save();['n','m','p','t'].forEach(i=>$('#'+i).value='');toast('تمت إضافة العائلة ✓');renderStats()};

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=get(b.dataset.id);if(!f)return;
({clr:()=>{f.changes=[];save();refresh()},edit:()=>editM(f),vars:()=>varsM(f),del:()=>delM(f),link:()=>linkM(f)})[b.dataset.a]()});

function editM(f){modal(`<h2>تعديل التفاصيل</h2><label>اسم رب الأسرة</label><input id="e1" value="${esc(f.name)}"><label>عدد أفراد الأسرة</label><input id="e2" type="number" inputmode="numeric" value="${f.members}"><label>رقم الصفحة</label><input id="e3" value="${esc(f.page)}"><label>الملاحظات</label><textarea id="e4">${esc(f.notes)}</textarea><div class="row" style="margin-top:16px"><button class="btn" id="ok">حفظ</button><button class="btn alt" onclick="closeM()">إلغاء</button></div>`);
$('#ok').onclick=()=>{const n=$('#e1').value.trim(),m=parseInt($('#e2').value);if(!n||!(m>=0))return toast('تحقق من البيانات');
Object.assign(f,{name:n,members:m,page:$('#e3').value.trim(),notes:$('#e4').value.trim()});save();closeM();refresh();toast('تم الحفظ ✓')}}

function varsM(f){let n=1;
const draw=()=>{$('#vv').innerHTML=`<div class="kv"><span>عدد الأفراد</span><b class="mb">${f.members}</b></div><div class="kv"><span>حصة الطحين</span><b>${fmtShare(f.base)}</b></div><div class="kv"><span>المبلغ المستحق</span><b>${fmtMoney(f.base)}</b></div>`};
modal(`<h2>المتغيرات — ${esc(f.name)}</h2><div id="vv"></div><label>اختر عدد الأفراد</label><div class="nums" id="nm">${Array.from({length:10},(_,i)=>`<button class="num${i?'':' on'}" data-n="${i+1}">${i+1}</button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn" id="va">+ إضافة فرد</button><button class="btn warn" id="vd">− حذف فرد</button></div><button class="btn alt big" style="margin-top:10px" onclick="closeM()">إغلاق</button>`);draw();
$('#nm').onclick=e=>{const b=e.target.closest('.num');if(!b)return;n=+b.dataset.n;document.querySelectorAll('.num').forEach(x=>x.classList.toggle('on',x===b))};
const ap=s=>{const old=f.members,nm=Math.max(0,old+s*n),d=nm-old;if(!d)return toast('لا يمكن الحذف أكثر من العدد الحالي');
f.members=nm;f.base=Math.max(0,f.base+d);(f.changes=f.changes||[]).push({t:d>0?'add':'del',n:Math.abs(d)});save();draw();refresh();toast(d>0?`تمت إضافة ${d} ✓`:`تم حذف ${-d} ✓`)};
$('#va').onclick=()=>ap(1);$('#vd').onclick=()=>ap(-1)}

function delM(f){modal(`<h2>⚠️ تحذير</h2><p>هل تود بالفعل حذف عائلة «${esc(f.name)}» بالكامل؟ لا يمكن التراجع.</p><div class="row"><button class="btn warn" id="ok">نعم</button><button class="btn alt" onclick="closeM()">إلغاء</button></div>`);
$('#ok').onclick=()=>{DB=DB.filter(x=>x.id!==f.id);DB.forEach(x=>x.links=x.links.filter(i=>i!==f.id));save();closeM();refresh();toast('تم الحذف')}}

function linkM(f){const sel=new Set(f.links);
modal(`<h2>ربط العوائل — ${esc(f.name)}</h2><input id="lq" placeholder="ابحث عن العائلة المراد ربطها..."><div id="ll"></div><div class="row" style="margin-top:16px"><button class="btn" id="ok">حفظ المعلومات</button><button class="btn alt" onclick="closeM()">إلغاء</button></div>`);
const draw=()=>{const ids=new Set([...sel,...find($('#lq').value).map(x=>x.id)]);ids.delete(f.id);
$('#ll').innerHTML=[...ids].map(get).filter(Boolean).map(x=>`<label class="pick"><input type="checkbox" value="${x.id}" ${sel.has(x.id)?'checked':''}><span>${esc(x.name)}</span><small>${esc(x.page)}</small></label>`).join('')||'<div class="hint">ابحث لتظهر العوائل</div>'};
draw();$('#lq').oninput=draw;
$('#ll').onchange=e=>{e.target.checked?sel.add(e.target.value):sel.delete(e.target.value)};
$('#ok').onclick=()=>{f.links=[...sel];save();closeM();refresh();toast('تم الربط ✓')}}

$('#bk').onclick=async()=>{if(!DB.length)return toast('لا توجد بيانات');
const data=JSON.stringify({app:'flour-families',version:1,families:DB},null,2),name=`families-${new Date().toISOString().slice(0,10)}.json`,C=window.Capacitor;
if(C&&C.isNativePlatform&&C.isNativePlatform()){try{const{Filesystem,Share}=C.Plugins,r=await Filesystem.writeFile({path:name,data,directory:'CACHE',encoding:'utf8'});await Share.share({title:name,url:r.uri,dialogTitle:'احفظ النسخة الاحتياطية'});return}catch(e){}}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;a.click();toast('تم تجهيز الملف')};
$('#rs').onclick=()=>$('#rf').click();
$('#rf').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;
try{const j=JSON.parse(await file.text()),a=Array.isArray(j)?j:j.families;if(!Array.isArray(a))throw 0;
modal(`<h2>استعادة البيانات</h2><p>سيتم استبدال بيانات العوائل الحالية بـ ${a.length} عائلة من الملف.</p><div class="row"><button class="btn" id="ok">استعادة</button><button class="btn alt" onclick="closeM()">إلغاء</button></div>`);
$('#ok').onclick=()=>{DB=a.map(f=>({id:String(f.id||Math.random().toString(36).slice(2)),name:f.name||'',members:+f.members||0,base:+(f.base??f.members)||0,page:String(f.page??''),notes:f.notes||'',links:Array.isArray(f.links)?f.links:[],changes:Array.isArray(f.changes)?f.changes:[]}));save();closeM();refresh();toast('تمت الاستعادة ✓')}}
catch(x){toast('الملف غير صالح')}};
refresh();
</script>
</body>
</html>
